<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EcoTrack - Eco Activities</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4fff4;
            margin: 0;
        }

        nav {
            background-color: #20b83a;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-weight: bold;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            color: #269b3a;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background-color: #20b83a;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

<nav>
    <a href="/Ecotrack/index.html">🏠 Home</a>
    <a href="/Ecotrack/carbon.html">🌍 Carbon Tracker</a>
    <a href="/Ecotrack/recycling.html">♻️ Recycling</a>
    <a href="/Ecotrack/activities.html">🌱 Eco Activities</a>
    <a href="/Ecotrack/progress.html">📊 Progress</a>
</nav>

<div class="container">

    <h1>🌱 Eco Activities</h1>

    <form action="saveActivity" method="post">

        <label>Select Activity:</label>

        <select name="activity" required>
            <option value="">-- Select Activity --</option>
            <option value="Recycling">♻️ Recycling</option>
            <option value="Tree Planting">🌳 Tree Planting</option>
            <option value="Cycling">🚲 Cycling</option>
            <option value="Public Transport">🚌 Public Transport</option>
            <option value="Energy Saving">💡 Energy Saving</option>
        </select>

        <br><br>

        <label>Quantity:</label>

        <input type="number"
               name="quantity"
               id="quantity"
               min="1"
               required>

        <br><br>

        <button type="submit">
            Save Activity
        </button>

    </form>

</div>

<script>
function recordActivity() {

    let activity = document.getElementById("activity").value;
    let quantity = document.getElementById("quantity").value;

    if (quantity === "" || quantity <= 0) {
        document.getElementById("message").innerHTML =
            "⚠️ Please enter a valid quantity.";
        return;
    }

    document.getElementById("message").innerHTML =
        "✅ " + quantity + " " + activity + " recorded successfully!";
}
</script>

</body>
</html>
