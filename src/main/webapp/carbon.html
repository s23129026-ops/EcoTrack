<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EcoTrack - Carbon Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f1f8e9;
        }

        nav {
            background-color: #2e7d32;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px gray;
        }

        h1 {
            color: #2e7d32;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <nav>
    <a href="/Ecotrack/index.html">🏠 Home</a>
    <a href="/Ecotrack/carbon.html">🌍 Carbon Tracker</a>
    <a href="/Ecotrack/recycling.html">♻️ Recycling</a>
    <a href="/Ecotrack/activities.html">🌱 Eco Activities</a>
    <a href="/Ecotrack/progress.html">📊 Progress</a>
    <a href="/Ecotrack/rewards.html">🏆 Rewards</a>
</nav>

    <div class="container">

        <h1>🌍 Carbon Tracker</h1>

        <p>Enter your daily activities to estimate your carbon footprint.</p>

        <form action="saveCarbon" method="post">

    <label>🚗 Travel Distance (km)</label>
    <input type="number" name="travel" id="travel"
           placeholder="Enter Kilometers" required>

    <label>⚡ Electricity Usage (kWh)</label>
    <input type="number" name="electricity" id="electricity"
           placeholder="Enter kWh" required>

    <label>🍽 Meals per Day</label>
    <input type="number" name="meals" id="meals"
           placeholder="Enter number of meals" required>

    <button type="submit">Calculate & Save Carbon</button>

</form>

    </div>

</body>
</html>
