<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>EcoTrack - Recycling</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f1f8e9;
}

nav {
    background-color: #2e7d32;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
    font-size: 16px;
}

nav a:hover {
    text-decoration: underline;
}

.container {
    text-align: center;
    padding: 40px;
}

h1 {
    color: #2e7d32;
    font-size: 36px;
}

.card {
    background-color: white;
    width: 350px;
    margin: 30px auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 10px gray;
}

label {
    display: block;
    text-align: left;
    margin-top: 15px;
    font-weight: bold;
    color: #444;
}

select,
input {
    width: 100%;
    padding: 10px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #bbb;
    border-radius: 5px;
}

button {
    margin-top: 25px;
    padding: 12px 25px;
    background-color: #2e7d32;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #1b5e20;
}

footer {
    text-align: center;
    padding: 15px;
    background-color: #2e7d32;
    color: white;
    margin-top: 40px;
}

</style>

</head>

<body>

<nav>

<a href="/Ecotrack/index.html">🏠 Home</a>

<a href="/Ecotrack/carbon.html">
🌍 Carbon Tracker
</a>

<a href="/Ecotrack/recycling.html">
♻️ Recycling
</a>

<a href="/Ecotrack/activities.html">
🌱 Eco Activities
</a>

<a href="/Ecotrack/progress.html">
📊 Progress
</a>

<a href="/Ecotrack/rewards.html">
🏆 Rewards
</a>

</nav>


<div class="container">

<h1>♻️ Recycling Tracker</h1>

<div class="card">

<form action="saveActivity" method="post">

<label for="activity">
Recycling Material
</label>

<select name="activity" id="activity" required>

<option value="">Select material</option>

<option value="Recycling">Plastic</option>

<option value="Recycling">Paper</option>

<option value="Recycling">Glass</option>

<option value="Recycling">Metal</option>

<option value="Recycling">Electronic Waste</option>

</select>


<label for="quantity">
Quantity (kg)
</label>

<input
    type="number"
    name="quantity"
    id="quantity"
    min="1"
    step="0.1"
    required>

<button type="submit">
Save Recycling
</button>
</form>
</div>
</div>
<footer>
© 2026 EcoTrack | Building a Greener Future 🌱
</footer>
</body>
</html>
